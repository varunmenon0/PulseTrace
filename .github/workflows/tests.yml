name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgles2 libegl1 libgl1 libglib2.0-0
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: pulsetrace demo --output outputs/demo
      - run: python -m build
