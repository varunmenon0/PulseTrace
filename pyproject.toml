[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsetrace"
version = "0.2.0"
description = "Video-based heart-rate estimation with reproducible facial rPPG extraction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-contrib-python>=4.8,<5", "mediapipe>=0.10.20,<0.11", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
pulsetrace = "pulsetrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
